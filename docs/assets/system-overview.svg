<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Затея: путь голосовой записи</title>
  <desc id="desc">Диктофон передаёт запись шлюзу. Шлюз распознаёт речь, передаёт текст локальному агенту Codex, сохраняет идеи и связанные страницы в Obsidian, синтезирует голосовой ответ и возвращает его устройству.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a31"/><stop offset="1" stop-color="#182644"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#74d8e8"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#eaf2ff}.small{font-size:15px;fill:#b9c8df}.label{font-size:21px;font-weight:700}.tag{font-size:15px;font-weight:700;fill:#9cc2e8}</style>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <text x="600" y="45" text-anchor="middle" class="label">Затея: от записи к базе идей</text>
  <g fill="#203653" stroke="#54bad1" stroke-width="2">
    <rect x="35" y="105" width="230" height="145" rx="18"/>
    <rect x="330" y="105" width="230" height="145" rx="18"/>
    <rect x="625" y="105" width="230" height="145" rx="18"/>
    <rect x="920" y="105" width="245" height="145" rx="18"/>
  </g>
  <g text-anchor="middle">
    <text x="150" y="153" class="label">StickS3</text><text x="150" y="186" class="small">запись по кнопке</text><text x="150" y="210" class="small">и голосовой ответ</text>
    <text x="445" y="153" class="label">Voice Gateway</text><text x="445" y="186" class="small">очередь · распознавание</text><text x="445" y="210" class="small">синтез речи · запись</text>
    <text x="740" y="153" class="label">Codex Agent</text><text x="740" y="186" class="small">оформляет идеи</text><text x="740" y="210" class="small">и связывает знания</text>
    <text x="1042" y="153" class="label">Obsidian</text><text x="1042" y="186" class="small">источники · идеи · wiki</text><text x="1042" y="210" class="small">планы · задания</text>
  </g>
  <g stroke="#74d8e8" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M270 150h50"/><path d="M565 150h50"/><path d="M445 250v35h597v-25"/>
    <path d="M625 215h-50"/><path d="M330 215h-50"/>
  </g>
  <text x="600" y="313" text-anchor="middle" class="small">Шлюз сохраняет запись и применяет предложенные агентом изменения к Obsidian</text>
  <text x="600" y="345" text-anchor="middle" class="small">После сохранения изменения автоматически коммитятся и отправляются в origin</text>
  <text x="600" y="390" text-anchor="middle" class="tag">УЧЁТНЫЕ ДАННЫЕ CODEX ОСТАЮТСЯ НА СЕРВЕРЕ</text>
</svg>
