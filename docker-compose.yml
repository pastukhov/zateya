# Single gateway container. Mutable data is bind-mounted from ./data.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: zateya-voice-gateway:latest
    user: "${ZATEYA_UID:-1000}:${ZATEYA_GID:-1000}"
    ports:
      - "${VOICE_BIND_PORT:-8080}:${VOICE_BIND_PORT:-8080}"
    environment:
      VOICE_BIND_HOST: ${VOICE_BIND_HOST:-0.0.0.0}
      VOICE_BIND_PORT: ${VOICE_BIND_PORT:-8080}
      ARCHIVE_ROOT: /data/archive
      VOICE_JOB_DATABASE: /data/archive/voice-jobs.sqlite
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_RESPONSE_FORMAT: ${LLM_RESPONSE_FORMAT:-text}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      LLM_HISTORY_TURNS: ${LLM_HISTORY_TURNS:-6}
      LLM_HISTORY_MAX_CHARS: ${LLM_HISTORY_MAX_CHARS:-12000}
      VOICE_DEVICE_TOKENS: ${VOICE_DEVICE_TOKENS:-}
      VOICE_API_KEY: ${VOICE_API_KEY:-}
      VOICE_AUTH_ENABLED: ${VOICE_AUTH_ENABLED:-}
      VOICE_RATE_LIMIT: ${VOICE_RATE_LIMIT:-100}
      VOICE_RATE_PERIOD: ${VOICE_RATE_PERIOD:-60}
      STT_BASE_URL: ${STT_BASE_URL:-https://openrouter.ai/api/v1}
      STT_API_KEY: ${STT_API_KEY:-${LLM_API_KEY:-}}
      STT_MODEL: ${STT_MODEL:-openai/whisper-1}
      STT_TIMEOUT: ${STT_TIMEOUT:-60}
      TTS_BASE_URL: ${TTS_BASE_URL:-https://openrouter.ai/api/v1/audio/speech}
      TTS_API_KEY: ${TTS_API_KEY:-${LLM_API_KEY:-}}
      TTS_MODEL: ${TTS_MODEL:-x-ai/grok-voice-tts-1.0}
      TTS_VOICE: ${TTS_VOICE:-eve}
      TTS_INSTRUCTIONS: ${TTS_INSTRUCTIONS-}
      TTS_TIMEOUT: ${TTS_TIMEOUT:-60}
      VOICE_KNOWLEDGE_ENABLED: ${VOICE_KNOWLEDGE_ENABLED:-true}
      OBSIDIAN_VAULT_PATH: /data/obsidian
      OBSIDIAN_INBOX: ${OBSIDIAN_INBOX:-Voice Inbox}
      NOTE_INCLUDE_TRANSCRIPT: ${NOTE_INCLUDE_TRANSCRIPT:-false}
      GIT_SSH_COMMAND: ssh -i /data/ssh/id_ed25519 -o UserKnownHostsFile=/data/ssh/known_hosts -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Затея}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-zateya@localhost}
      GIT_COMMITTER_NAME: ${GIT_COMMITTER_NAME:-Затея}
      GIT_COMMITTER_EMAIL: ${GIT_COMMITTER_EMAIL:-zateya@localhost}
    volumes:
      - ./data/archive:/data/archive
      - ./data/obsidian:/data/obsidian
      - ./data/ssh:/data/ssh:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health/live' % os.environ.get('VOICE_BIND_PORT', '8080'))
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
